[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qlik-mcp-server"
version = "0.4.0"
description = "Model Context Protocol server exposing Qlik Cloud capabilities to AI agents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0.0,<3",
    "websockets>=13.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.12.0",
    "annotated-types>=0.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
qlik-mcp-server = "qlik_mcp_server.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires live Qlik Cloud tenant",
]
filterwarnings = [
    # Starlette's TestClient still imports the deprecated alias; not ours to fix.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "S"]
ignore = ["E501", "S101", "S105", "S106", "UP035", "UP007", "UP045"]
